<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Trace A/B 分析台 · 环境探针</title>
<style>
:root{--ink:#1d2126;--soft:#6b7280;--line:#e3e6ea;--ok:#15803d;--bad:#b42318;--warn:#8a5a00;--brand:#0e6b4e}
*{box-sizing:border-box}
body{margin:0;background:#f6f7f8;color:var(--ink);font:15px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:36px 20px 60px}
h1{font-size:24px;margin:0 0 4px}
.sub{color:var(--soft);font-size:14px;margin:0 0 20px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 6px;border-bottom:1px solid #f0f1f3;vertical-align:top}
td:first-child{width:38%;color:var(--soft)}
.ok{color:var(--ok);font-weight:600}.bad{color:var(--bad);font-weight:600}.warn{color:var(--warn);font-weight:600}
button{font:inherit;border:0;background:var(--brand);color:#fff;border-radius:9px;padding:9px 18px;cursor:pointer;font-weight:600}
.bar{height:6px;background:#eef0f2;border-radius:6px;overflow:hidden;margin:10px 0 4px}
.bar i{display:block;height:100%;width:0;background:var(--brand);transition:width .2s}
.note{font-size:13px;color:var(--soft)}
.verdict{font-size:17px;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Trace A/B 分析台 · 环境探针</h1>
<p class="sub">检查这台电脑的浏览器能否运行新版分析台。所有检查都在本机浏览器内完成，不会上传任何文件或结果；本页没有任何发送数据的代码。<a href="/">返回分析台</a></p>
<div class="card"><b>第 1 步 · 浏览器能力（自动）</b><table id="caps"></table></div>
<div class="card">
<b>第 2 步 · 选一个真实数据文件夹测速</b>
<p class="note">选一个包含 Dest_T537 / T714 CSV 的文件夹（可以是网络盘映射的盘符）。本页只在本机读取其中最大的一个 CSV，测一下读取速度，不会保存或上传。</p>
<button id="pick">选择文件夹</button>
<div id="pickRes" style="margin-top:12px"></div>
</div>
<div class="card"><b>结论</b><p id="verdict" class="verdict">等待检查…</p><p class="note">把这一页截图发回来即可。</p></div>
</main>
<script src="/probe.js"></script>
</body>
</html>
